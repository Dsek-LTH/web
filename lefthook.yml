# Git hooks, opt-in: `make hooks` installs them. Before a push, each check
# runs only if the pushed commits touch what it covers.
# go tool needs a go.mod where it runs, and lefthook needs to run in the
# repo root: -n only prints the path of the built binary.
lefthook: "$(go -C tools tool -n lefthook)"

pre-push:
  parallel: true
  jobs:
    - name: api
      glob: "apps/api/**"
      run: make lint-api
    - name: web
      glob: "apps/web/**"
      run: make lint-web
    - name: api-types
      glob: "apps/{api,web}/**"
      run: make api-types
    - name: workflows
      glob: ".github/workflows/**"
      run: make lint-ci
    - name: root
      glob: "{*.md,*.yml,*.yaml,.github/**,apps/poppler-server/**}"
      run: make lint-root
