engineStrict: true
resolutionMode: highest

overrides:
  "@prisma/generator-helper@5.14.0-dev.34": ^6.0.0
  "@prisma/internals@5.14.0-dev.34": ^6.0.0

patchedDependencies:
  devalue@5.8.1: patches/devalue@5.8.1.patch

# Dependency install scripts are denied by default. The Docker build already
# runs with --ignore-scripts, and Prisma downloads its engines on demand.
allowBuilds:
  "@prisma/client": false
  "@prisma/engines": false
  "@snaplet/seed": false
  "@tailwindcss/oxide": false
  esbuild: false
  prisma: false
  protobufjs: false
  sharp: false
  zenstack: false
