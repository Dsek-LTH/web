name: Deployment
permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to image registry
        id: registry-login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.IMAGEREPO_USERNAME }}
          password: ${{ secrets.IMAGEREPO_PASSWORD }}
          registry: registry.dsek.se
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:apps/web"
          build-args: |
            "PUBLIC_GO_BACKEND_URL=https://api.staging.dsek.se"
            "PUBLIC_MINIO_BASE_URL=https://files-sandbox.dsek.se"
            "PUBLIC_BUCKETS_ALBUMS=albums"
            "PUBLIC_BUCKETS_DOCUMENTS=documents"
            "PUBLIC_BUCKETS_FILES=files"
            "PUBLIC_BUCKETS_MEMBERS=members"
            "VERSION=${{ github.ref_name }}"
          push: true
          tags: registry.dsek.se/web-staging/web:latest

  poppler:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to image registry
        id: registry-login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.IMAGEREPO_USERNAME }}
          password: ${{ secrets.IMAGEREPO_PASSWORD }}
          registry: registry.dsek.se
      - name: Build and push poppler
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:apps/poppler-server"
          push: true
          tags: registry.dsek.se/web-staging/poppler:latest

  api:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to image registry
        id: registry-login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.IMAGEREPO_USERNAME }}
          password: ${{ secrets.IMAGEREPO_PASSWORD }}
          registry: registry.dsek.se
      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:apps/api"
          push: true
          tags: registry.dsek.se/web-staging/api:latest
