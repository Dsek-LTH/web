---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Deploy pr
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

jobs:
  web:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to image registry
        id: registry-login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.IMAGEREPO_USERNAME }}
          password: ${{ secrets.IMAGEREPO_PASSWORD }}
          registry: registry.dsek.se
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:apps/web"
          build-args: |
            "PUBLIC_GO_BACKEND_URL=https://web-pr-${{ github.event.number }}-api.apps.okd.dsek.se"
            "PUBLIC_MINIO_BASE_URL=https://files-sandbox.dsek.se"
            "PUBLIC_BUCKETS_ALBUMS=albums"
            "PUBLIC_BUCKETS_DOCUMENTS=documents"
            "PUBLIC_BUCKETS_FILES=files"
            "PUBLIC_BUCKETS_MEMBERS=members"
            "VERSION=${{ github.ref_name }}"
          push: true
          tags: registry.dsek.se/web-pr-${{ github.event.number }}/web:latest
      - name: Update preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `https://web-pr-${pr}.apps.okd.dsek.se`;
            const marker = '<!-- deploy-pr-preview -->';

            const timestamp = new Intl.DateTimeFormat('sv-SE', {
              timeZone: 'Europe/Stockholm',
              dateStyle: 'short',
              timeStyle: 'short'
            }).format(new Date());

            const body = `${marker}\nPreview image built. ArgoCD should deploy it shortly:\n\n${url}\n\n$\\color{gray}{\\textsf{\\emph{Last build: ${timestamp}}}}$`;

            // Update the comment from the previous build instead of adding a new one.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });
            let previous = null;
            for (const comment of comments) {
              if (comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)) {
                previous = comment;
              }
            }

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              });
            }
  poppler:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to image registry
        id: registry-login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.IMAGEREPO_USERNAME }}
          password: ${{ secrets.IMAGEREPO_PASSWORD }}
          registry: registry.dsek.se
      - name: Build and push poppler
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:apps/poppler-server"
          push: true
          tags: registry.dsek.se/web-pr-${{ github.event.number }}/poppler:latest

  api:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to image registry
        id: registry-login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.IMAGEREPO_USERNAME }}
          password: ${{ secrets.IMAGEREPO_PASSWORD }}
          registry: registry.dsek.se
      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:apps/api"
          push: true
          tags: registry.dsek.se/web-pr-${{ github.event.number }}/api:latest
