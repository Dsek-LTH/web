# The Playwright tests (apps/web/e2e): a production build of the frontend in
# a real browser against the backend on a seeded database. Not a required
# check while the suite settles; see "End-to-end tests" in AGENTS.md.
name: End-to-end tests

on:
  push:
    branches: ["main"]
    paths: ["apps/web/**", "apps/api/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["apps/web/**", "apps/api/**", ".github/workflows/e2e.yml"]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # The server e2e/backend.sh creates its dsek_e2e database on.
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7
        with:
          # svelte.config.js names the build after `git describe --tags`.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm i
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
