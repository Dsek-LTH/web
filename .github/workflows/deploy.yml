name: Deployment
permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to image registry
        id: registry-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.IMAGEREPO_USERNAME }}
          password: ${{ secrets.IMAGEREPO_PASSWORD }}
          registry: registry.dsek.se
      - name: Build and push website
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:frontend"
          build-args: |
            "PUBLIC_GO_BACKEND_URL=https://api.dsek.se"
            "PUBLIC_MINIO_BASE_URL=https://files.dsek.se"
            "PUBLIC_BUCKETS_ALBUMS=albums"
            "PUBLIC_BUCKETS_DOCUMENTS=documents"
            "PUBLIC_BUCKETS_FILES=files"
            "PUBLIC_BUCKETS_MEMBERS=members"
            "VERSION=${{ github.ref_name }}"
          push: true
          tags: registry.dsek.se/web/website:latest

  poppler:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to image registry
        id: registry-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.IMAGEREPO_USERNAME }}
          password: ${{ secrets.IMAGEREPO_PASSWORD }}
          registry: registry.dsek.se
      - name: Build and push poppler
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:poppler-server"
          push: true
          tags: registry.dsek.se/web/poppler:latest

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to image registry
        id: registry-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.IMAGEREPO_USERNAME }}
          password: ${{ secrets.IMAGEREPO_PASSWORD }}
          registry: registry.dsek.se
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:backend"
          push: true
          tags: registry.dsek.se/web/backend:latest
