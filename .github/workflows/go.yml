name: Go CI

on:
  push:
    branches: ["main", "new-design"]
    paths: ["backend/**", ".github/workflows/go.yml"]
  pull_request:
    branches: ["main", "new-design"]
    paths: ["backend/**", ".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsek
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Overrides backend/.env, so the tests that need a database use the
      # service above.
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/dsek?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      # The generated code in internal/db matches schema.sql and queries/.
      - run: go tool sqlc diff
      - run: go tool migrate up
      # Some tests attach their data to seeded rows.
      - run: go tool seed
      - run: go test ./...
