# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main", "new-design"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-tags: true # This should be enough, see https://github.com/actions/checkout/issues/1471
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm i
      - run: pnpm run lint --max-warnings 0
      - run: pnpm run format
      - run: pnpm run test
      - run: pnpm run check --fail-on-warnings
      - run: pnpm run check-translations
      - run: pnpm run build
      # When adding a step to the list above, please consider adding it to the `ci-check` script in `apps/web/package.json`.
      # schema.d.ts is what pnpm generate:api makes from the backend's
      # OpenAPI document.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: pnpm generate:api
      - run: git diff --exit-code src/lib/api/schema.d.ts
