# golangci-lint (make lint-api, and CI): the standard linters - errcheck,
# govet, ineffassign, staticcheck, unused.
version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults:
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # "Could apply De Morgan's law": the negated form often reads as
        # the rule it implements.
        - -QF1001
  exclusions:
    presets:
      # Unchecked Close errors and the like.
      - std-error-handling
