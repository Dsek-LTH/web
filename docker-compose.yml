version: "3.8"

services:
  db:
    container_name: dsek-db
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dsek
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

  meilisearch:
    container_name: dsek-meilisearch
    image: getmeili/meilisearch:latest
    restart: always
    environment:
      - MEILI_MASTER_KEY=masterKey
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meilisearch:/data.ms

  poppler-server:
    build:
      context: ./apps/poppler-server
      dockerfile: Dockerfile
    container_name: dsek-poppler
    restart: always
    environment:
      - PORT=8800
    ports:
      - "8800:8800"

  # Local trace viewer, opt-in: `docker compose --profile tracing up -d`,
  # then set OTEL_EXPORTER_OTLP_TRACES_ENDPOINT in apps/backend/.env. UI on
  # http://localhost:16686.
  jaeger:
    container_name: dsek-jaeger
    image: jaegertracing/jaeger:latest
    profiles: ["tracing"]
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  db:
  meilisearch:
